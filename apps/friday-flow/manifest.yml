modules:
  jira:projectPage:
    - key: friday-flow-page
      resource: main
      resolver:
        function: resolver
      render: native
      title: FRIDAY Flow
      layout: basic
  function:
    - key: resolver
      handler: index.handler
      # A Atlassian cobra uma função que falha até este limite; uma visita normal demora poucos segundos.
      timeoutSeconds: 25
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    - read:jira-work
app:
  id: ari:cloud:ecosystem::app/360ae8cc-ab00-48b0-9d21-55416fc94182
  runtime:
    name: nodejs22.x
    # Metade dos 512 MB por omissão: a app usa pouca memória e o custo por visita cai para metade.
    memoryMB: 256
  licensing:
    enabled: true
