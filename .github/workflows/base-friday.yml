# Base de teste do FRIDAY (projeto FRIBASE), simulada em tempo real: cria e move tickets a cada 2 horas
# durante 36 dias, para o FRIDAY ter histórico verdadeiro. Ver scripts/base-friday.mjs.
# Só faz alguma coisa depois de ser iniciada à mão (Run workflow com «start»); depois dos 36 dias não faz nada.
# DESLIGADA a 15/11/2026: a importação JSON funcionou no FRIBASE, com histórico no passado. Para voltar a ligar,
# repor o bloco «schedule» com cron '23 */2 * * *' (e usar outro projeto, para não misturar com a importação).
name: Base de teste FRIDAY

on:
  workflow_dispatch:
    inputs:
      start:
        description: Iniciar a base (cria o projeto FRIBASE se faltar e marca o início)
        type: boolean
        default: false
      site:
        description: Site Jira de teste
        type: string
        default: arturmaiadecastro.atlassian.net

concurrency:
  group: base-friday
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  passo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JIRA_SITE: ${{ inputs.site || 'arturmaiadecastro.atlassian.net' }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL || secrets.FORGE_EMAIL }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN || secrets.FORGE_API_TOKEN }}
      PROJECT_KEY: FRIBASE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Passo da simulação
        run: node scripts/base-friday.mjs ${{ inputs.start && '--start' || '' }}
